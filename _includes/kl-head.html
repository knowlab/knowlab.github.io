<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.layout != 'home' %}{{ page.title }} &bull; {% endif %}{{ site.name }}</title>
{%- assign base_url = "https://" | append: site.url -%}
{%- assign page_desc = page.summary | default: page.description | default: site.description.meta -%}
{%- assign page_url = base_url | append: page.url -%}
<meta name="description" content="{{ page_desc | strip_html | escape }}">
<link rel="canonical" href="{{ page_url }}">
<meta property="og:site_name" content="{{ site.name }}">
<meta property="og:type" content="{% if page.layout == 'story' %}article{% else %}website{% endif %}">
<meta property="og:title" content="{{ page.title | default: site.name | strip_html | escape }}">
<meta property="og:description" content="{{ page_desc | strip_html | escape }}">
<meta property="og:url" content="{{ page_url }}">
{%- if page.image %}
<meta property="og:image" content="{{ base_url }}/{{ page.image | remove_first: '/' }}">
{%- endif %}
<meta name="twitter:card" content="summary">
{%- if page.layout == 'story' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": {{ page.title | jsonify }},
  "description": {{ page.summary | jsonify }},
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "mainEntityOfPage": "{{ page_url }}",
  "author": { "@type": "Organization", "name": "KnowLab", "url": "{{ base_url }}/" },
  "publisher": { "@type": "Organization", "name": "KnowLab", "url": "{{ base_url }}/" }{% if page.paper_title %},
  "about": {
    "@type": "ScholarlyArticle",
    "name": {{ page.paper_title | jsonify }},
    "url": {{ page.paper_url | jsonify }},
    "author": {{ page.authors | jsonify }},
    "isPartOf": {{ page.venue | jsonify }}
  }{% endif %}
}
</script>
{%- endif %}
<link rel="alternate" type="application/rss+xml" title="RSS 2.0" href="{{ site.baseurl }}/feed.xml">
<link rel="apple-touch-icon" href="{{ site.baseurl }}/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="{{ site.baseurl }}/favicon.svg">
<link rel="icon" href="{{ site.baseurl }}/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" href="{{ site.baseurl }}/favicon.png" sizes="32x32">
<link rel="icon" type="image/png" href="{{ site.baseurl }}/favicon-96x96.png" sizes="96x96">
<meta name="theme-color" content="{{ site.theme-color-attr }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ site.baseurl }}/css/home.css?v={{ site.time | date: "%s" }}">
