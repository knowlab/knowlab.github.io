{%- assign u = page.url -%}
<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="{{ site.baseurl }}/" aria-label="{{ site.name }} home"><img class="logo" src="{{ site.baseurl }}/img/knowlab-mark.svg" alt=""><span class="wordmark" aria-hidden="true"><span>Know</span><span>Lab</span></span></a>
    <nav class="nav" aria-label="Main">
      <a class="link{% if u == '/' %} on{% endif %}" href="{{ site.baseurl }}/">Home</a>
      <a class="link{% if u == '/updates/' %} on{% endif %}" href="{{ site.baseurl }}/updates/">News</a>
      <a class="link{% if u contains '/blog' %} on{% endif %}" href="{{ site.baseurl }}/blog/">Blog</a>
      <a class="link{% if u == '/publications/' %} on{% endif %}" href="{{ site.baseurl }}/publications/">Publications</a>
      <a class="link{% if u == '/group-members/' %} on{% endif %}" href="{{ site.baseurl }}/group-members/">Members</a>
      <a class="link{% if u == '/projects/' %} on{% endif %}" href="{{ site.baseurl }}/projects/">Projects</a>
    </nav>
  </div>
</header>
