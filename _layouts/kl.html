<!DOCTYPE html>
<html lang="{{ site.lang }}" prefix="og: http://ogp.me/ns#">
<head>
  {% include kl-head.html %}
</head>
<body class="kl">
  {% include kl-header.html %}
  <main class="inner">
    <div class="wrap">
      <div class="page-head">
        <div class="eyebrow">{{ site.name }}</div>
        <h1 class="serif">{{ page.title }}</h1>
      </div>
      <div class="prose">
        {{ content }}
      </div>
    </div>
  </main>
  {% include kl-footer.html %}
  <script>
    // Wrap wide tables so they scroll sideways on small screens instead of breaking the page.
    document.querySelectorAll('.prose table').forEach(function (t) {
      // Copy column headings onto cells so narrow screens can show them as labels (see css/home.css).
      var heads = [].map.call(t.querySelectorAll('thead th'), function (th) { return th.textContent.trim(); });
      t.querySelectorAll('tbody tr').forEach(function (tr) {
        [].forEach.call(tr.children, function (td, i) { if (heads[i]) td.setAttribute('data-label', heads[i]); });
      });
      var w = document.createElement('div');
      w.className = 'tablewrap';
      t.parentNode.insertBefore(w, t);
      w.appendChild(t);
    });
  </script>
</body>
</html>
